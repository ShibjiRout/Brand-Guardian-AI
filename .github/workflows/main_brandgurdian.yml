name: Test, build, and deploy to Linode

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run smoke tests
        run: uv run pytest tests/ -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/brand-guardian-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/brand-guardian-api:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Linode via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USERNAME }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/brand-guardian-api:latest
            docker stop brand-guardian-api || true
            docker rm brand-guardian-api || true
            docker run -d --name brand-guardian-api --restart unless-stopped \
              --env-file ~/brand-guardian-deploy/.env -p 127.0.0.1:8000:8000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/brand-guardian-api:latest
            cd ~/brand-guardian-deploy/Brand-Guardian-AI && git pull
